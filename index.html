<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Memo</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f6f64"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#23312f;--mute:#6b7773;--line:#e3dccb;--acc:#1f6f64;--acc-ink:#fff;--H:#d9822b;--B:#c4452f;--A:#4a6fa5;--K:#8a5a9e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161d1c;--card:#1f2827;--ink:#ecf0ee;--mute:#9aa8a4;--line:#2f3b39;--acc:#4fb8a8;--acc-ink:#0e1a18;--H:#e8a050;--B:#e8705c;--A:#7ea4d9;--K:#c08ad6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161d1c;--card:#1f2827;--ink:#ecf0ee;--mute:#9aa8a4;--line:#2f3b39;--acc:#4fb8a8;--acc-ink:#0e1a18;--H:#e8a050;--B:#e8705c;--A:#7ea4d9;--K:#c08ad6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font:700 26px/1.1 "Iowan Old Style",Georgia,serif;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.tabs{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:none;color:var(--ink);padding:9px 0;border-radius:9px;font:600 14px inherit;font-family:inherit}
.tabs button.on{background:var(--card);box-shadow:0 1px 3px #0002}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:6px}
.chips.k{grid-template-columns:1fr 1fr;margin-bottom:12px}
.chips button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 2px;font-family:inherit}
.chips b{font-size:14px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card.list{padding:2px 12px}
.drow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.drow>div{text-align:center;flex:1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
textarea,.login input{width:100%;margin:6px 0}
.wd{font-size:13px;color:var(--mute);margin-top:4px}
.ic{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink);font-size:22px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin-top:10px;justify-content:center}
.row{padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.det{width:40px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:none;font-size:17px;padding:0}
.bt{display:flex;gap:6px;align-items:center}
.tk{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:none;font-size:18px;opacity:.4;padding:0}
.tk.on{opacity:1;color:#fff}
.tk.H.on{background:var(--H);border-color:var(--H)}.tk.B.on{background:var(--B);border-color:var(--B)}.tk.A.on{background:var(--A);border-color:var(--A)}.tk.K.on{background:var(--K);border-color:var(--K)}
.pt{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:14px}
.pt b{min-width:34px;text-align:center}
.pt button{width:30px;height:38px;border-radius:9px;border:1.5px solid var(--line);background:none;color:var(--ink);font-size:18px;padding:0}
.bks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bks button{border:1.5px solid var(--line);background:none;border-radius:999px;padding:6px 12px;color:var(--ink);font:inherit;font-size:13px}
.bks button.on{background:var(--K);border-color:var(--K);color:#fff}
.pri{width:100%;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);padding:12px;font:700 15px inherit;font-family:inherit}
.del{border:1.5px solid var(--line);background:none;color:var(--mute);border-radius:10px;padding:8px 12px;font-family:inherit}
.del.sure{border-color:var(--B);color:var(--B);font-weight:700}
.empty,.note{color:var(--mute);font-size:14px;text-align:center;padding:10px}
table{width:100%;border-collapse:collapse}
th{font-size:17px;font-weight:400;padding:4px 0}
th:first-child{text-align:left}
td{text-align:center;padding:9px 0;border-top:1px solid var(--line);font-weight:700}
td:first-child{text-align:left;font-weight:600;overflow-wrap:anywhere;padding-right:6px}
td a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
td.zero{color:var(--line);font-weight:400}
td.H{color:var(--H)}td.B{color:var(--B)}td.A{color:var(--A)}td.K{color:var(--K)}td.p{color:var(--acc)}
.mrow{margin-bottom:10px}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sh{background:var(--card);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.big{font-size:20px}
.tot{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:700;margin:10px 0}
.tot .H{color:var(--H)}.tot .B{color:var(--B)}.tot .A{color:var(--A)}.tot .K{color:var(--K)}
.ent{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ent b{min-width:108px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== SYNC SETUP: replace null below with your Firebase config (see instructions), keep the semicolon =====
const FIREBASE_CONFIG = null;
// ==========================================================================================================
const CFG=FIREBASE_CONFIG;
const ORD=["1st","2nd","3rd","4th","5th","6th"];
const T=[["H","✏️","Homework not done"],["B","⚠️","Misbehaved"],["A","🚪","Absent"],["K","📕","Forgot books"]];
const BK=["Student’s book","Display book","Story"];
const MIN="2026-12-01",MAX="2027-07-31";
const MON=["2026-12","2027-01","2027-02","2027-03","2027-04","2027-05","2027-06","2027-07"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const clamp=d=>d<MIN?MIN:d>MAX?MAX:d;
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={st:{},m:{},cls:"1-1"},tab="reg",date=clamp(iso(new Date())),sm=date.slice(0,7),delId=null,det=null;
let FSM=null,FS=null,AU=null,auth=null,user=null,authReady=false,failed=false,msg="",unsub=null,status=CFG?"Connecting…":"This device only";
try{const x=JSON.parse(localStorage.getItem("zkmemo2"));
 if(x&&x.st)S=Object.assign(S,x);
 else{const o=JSON.parse(localStorage.getItem("zkmemo"));
  if(o&&Array.isArray(o.st)){o.st.forEach(s=>{S.st["o"+s.i]={n:s.n,c:s.c}});for(const d in o.m)for(const k in o.m[d])S.m[d+"_o"+k]={f:o.m[d][k],b:[],p:0};S.cls=o.cls||"1-1"}}}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const gk=()=>S.cls.split("-").map(Number);
const E=(d,id)=>S.m[d+"_"+id]||{f:"",b:[],p:0};
const list=()=>Object.keys(S.st).filter(i=>S.st[i].c===S.cls).map(i=>({i,n:S.st[i].n})).sort((a,b)=>a.n.localeCompare(b.n));
const cname=()=>{const[g,k]=gk();return ORD[g-1]+" grade · Group "+k};

function setStatus(t){status=t;const e=document.getElementById("st");if(e)e.textContent=t}
function save(){try{localStorage.setItem("zkmemo2",JSON.stringify({st:S.st,m:S.m,cls:S.cls}))}catch(e){}}
function pushMark(k,e){if(!FS)return;FS.setDoc(FS.doc(FS.db,"memo","m_"+k.slice(0,7)),{[k]:e||FS.deleteField()},{merge:true}).catch(()=>{})}
function pushStu(i,v){if(!FS)return;FS.setDoc(FS.doc(FS.db,"memo","students"),{[i]:v||FS.deleteField()},{merge:true}).catch(()=>{})}
function pushAll(){pushed=true;FS.setDoc(FS.doc(FS.db,"memo","students"),S.st,{merge:true});const g={};for(const k in S.m){(g[k.slice(0,7)]=g[k.slice(0,7)]||{})[k]=S.m[k]}for(const m in g)FS.setDoc(FS.doc(FS.db,"memo","m_"+m),g[m],{merge:true})}
let pushed=false;
function listen(){FS=FSM;unsub=FS.onSnapshot(FS.collection(FS.db,"memo"),snap=>{
 const st={},m={};let has=false;
 snap.forEach(d=>{has=true;const x=d.data();if(d.id==="students")Object.assign(st,x);else if(d.id.slice(0,2)==="m_")Object.assign(m,x)});
 const md=snap.metadata;
 if(has){S.st=st;S.m=m;save()}
 else if(!md.fromCache&&!pushed&&Object.keys(S.st).length)pushAll();
 status=md.hasPendingWrites?"Saving…":md.fromCache?"Syncing…":"Synced ✓";
 if(!(tab==="stu"&&document.activeElement&&document.activeElement.id==="nn"))render()
},()=>setStatus("No access: check your login and rules"))}

function upd(id,fn){const o=E(date,id),x={f:o.f,b:o.b.slice(),p:o.p};fn(x);if(!x.f.includes("K"))x.b=[];const k=date+"_"+id;
 if(x.f||x.p||x.b.length){S.m[k]=x;pushMark(k,x)}else{delete S.m[k];pushMark(k,null)}save();render()}

function row(s){const e=E(date,s.i);
 return `<div class="row"><div class="top"><div class="nm">${esc(s.n)}</div><button class="det" data-a="det" data-s="${s.i}" aria-label="Details">📋</button></div>
 <div class="bt">${T.map(t=>`<button class="tk ${t[0]}${e.f.includes(t[0])?" on":""}" data-a="tk" data-s="${s.i}" data-t="${t[0]}" aria-label="${t[2]}">${t[1]}</button>`).join("")}<span class="pt"><button data-a="pt" data-s="${s.i}" data-d="-1" aria-label="Remove a point">−</button><b>⭐${e.p}</b><button data-a="pt" data-s="${s.i}" data-d="1" aria-label="Add a point">+</button></span></div>
 ${e.f.includes("K")?`<div class="bks">${BK.map(b=>`<button class="${e.b.includes(b)?"on":""}" data-a="bk" data-s="${s.i}" data-v="${b}">${b}</button>`).join("")}</div>`:""}</div>`}

function reg(){const L=list();
 return `<div class="card"><div class="drow"><button class="ic" data-a="prev" aria-label="Previous day">‹</button><div><input type="date" id="dt" value="${date}" min="${MIN}" max="${MAX}"><div class="wd">${pd(date).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div></div><button class="ic" data-a="next" aria-label="Next day">›</button></div>
 <div class="legend">${T.map(t=>`<span>${t[1]} ${t[2]}</span>`).join("")}<span>⭐ Extra points</span></div></div>`+
 (L.length?`<div class="card list">${L.map(row).join("")}</div>`:`<div class="card empty">No students yet in this class. Open the Students tab to add them.</div>`)}

function sum(){const L=list(),r={},cols=["H","B","A","K","p"];
 for(const k in S.m){if(sm!=="all"&&k.slice(0,7)!==sm)continue;const id=k.slice(11),e=S.m[k],c=r[id]=r[id]||{H:0,B:0,A:0,K:0,p:0};for(const f of e.f)c[f]++;c.p+=e.p}
 const rows=L.map(s=>{const c=r[s.i]||{H:0,B:0,A:0,K:0,p:0};return{s,c,t:c.H+c.B+c.A+c.K}}).sort((a,b)=>b.t-a.t||a.s.n.localeCompare(b.s.n));
 const mo=MON.map(m=>`<option value="${m}"${sm===m?" selected":""}>${pd(m+"-01").toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</option>`).join("");
 return `<div class="mrow"><select id="sm"><option value="all"${sm==="all"?" selected":""}>All months</option>${mo}</select></div>`+
 (L.length?`<div class="card"><table><tr><th></th>${T.map(t=>`<th>${t[1]}</th>`).join("")}<th>⭐</th></tr>${rows.map(x=>`<tr><td><a data-a="det" data-s="${x.s.i}">${esc(x.s.n)}</a></td>${cols.map(t=>`<td class="${x.c[t]?t:"zero"}">${x.c[t]||"·"}</td>`).join("")}</tr>`).join("")}</table></div><div class="note">Tap a name to see all the details.</div>`
 :`<div class="card empty">No students in this class yet.</div>`)}

function stu(){const L=list(),on=CFG&&!failed;
 return `<div class="card"><label for="nn"><b>Add students to ${cname()}</b></label><textarea id="nn" rows="4" placeholder="One name per line. You can paste a whole list."></textarea><button class="pri" data-a="add">Add to this class</button></div>`+
 (L.length?`<div class="card list">${L.map(s=>`<div class="top row"><div class="nm">${esc(s.n)}</div>${delId===s.i?`<button class="del sure" data-a="del" data-s="${s.i}">Tap again to remove</button>`:`<button class="del" data-a="ask" data-s="${s.i}" aria-label="Remove">✕</button>`}</div>`).join("")}</div><div class="note">Removing a student also removes all their ticks.</div>`:"")+
 `<div class="card"><b>Data</b><div class="note" style="padding:6px 0 10px">${on?"Your data is synced between all your devices.":"Your data is stored on this device only."}</div><button class="pri" data-a="exp">Download backup</button>${on?`<button class="pri" data-a="out" style="margin-top:8px;background:none;color:var(--ink);border:1.5px solid var(--line)">Sign out</button>`:""}</div>`}

function sheet(){const s=S.st[det];if(!s)return"";
 const ks=Object.keys(S.m).filter(k=>k.slice(11)===det).sort().reverse(),t={H:0,B:0,A:0,K:0,p:0},bs={},c=s.c.split("-");
 ks.forEach(k=>{const e=S.m[k];for(const f of e.f)t[f]++;t.p+=e.p;e.b.forEach(b=>bs[b]=(bs[b]||0)+1)});
 return `<div class="ov" data-a="ov"><div class="sh"><div class="top"><div><b class="big">${esc(s.n)}</b><div class="wd" style="margin:0">${ORD[c[0]-1]} grade · Group ${c[1]}</div></div><button class="del" data-a="close">Close</button></div>
 <div class="tot">${T.map(x=>`<span class="${x[0]}">${x[1]} ${t[x[0]]}</span>`).join("")}<span>⭐ ${t.p}</span></div>
 ${Object.keys(bs).length?`<div class="wd" style="margin:0 0 8px">Books forgotten: ${Object.keys(bs).map(b=>esc(b)+" ×"+bs[b]).join(", ")}</div>`:""}
 ${ks.length?ks.map(k=>{const e=S.m[k],p=[...e.f].map(f=>{const x=T.find(y=>y[0]===f);return x[1]+" "+x[2]});if(e.p)p.push("⭐ +"+e.p);
  return `<div class="ent"><b>${pd(k.slice(0,10)).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</b><div>${p.join(" · ")}${e.b.length?`<div class="wd" style="margin:2px 0 0">${e.b.map(esc).join(", ")}</div>`:""}</div></div>`}).join(""):`<div class="empty">Nothing recorded yet.</div>`}
 </div></div>`}

function render(){const app=document.getElementById("app"),g=CFG&&!failed?(!authReady?1:!user?2:0):0;
 if(g===1){app.innerHTML=`<h1>Class Memo</h1><div class="sub">Connecting…</div>`;return}
 if(g===2){app.innerHTML=`<h1>Class Memo</h1><div class="sub">Sign in to open your class data</div><div class="card login"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="pri" data-a="login">Sign in</button><div class="note" id="lm">${msg}</div></div>`;return}
 app.innerHTML=`<h1>Class Memo</h1><div class="sub">December 2026 – July 2027 · <span id="st">${status}</span></div>
 <nav class="tabs">${[["reg","Register"],["sum","Summary"],["stu","Students"]].map(t=>`<button data-a="tab" data-v="${t[0]}" class="${tab===t[0]?"on":""}">${t[1]}</button>`).join("")}</nav>
 <div class="chips">${ORD.map((o,i)=>`<button data-a="gr" data-v="${i+1}" class="${gk()[0]==i+1?"on":""}"><b>${o}</b></button>`).join("")}</div><div class="chips k">${[1,2].map(k=>`<button data-a="gp" data-v="${k}" class="${gk()[1]==k?"on":""}"><b>Group ${k}</b></button>`).join("")}</div>`+
 (tab==="reg"?reg():tab==="sum"?sum():stu())+(det?sheet():"")}

function go(n){const d=pd(date);d.setDate(d.getDate()+n);date=clamp(iso(d));render()}
function doLogin(){const em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value,l=document.getElementById("lm");l.textContent="Signing in…";
 AU.signInWithEmailAndPassword(auth,em,pw).catch(()=>{l.textContent="Wrong email or password"})}

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=b.dataset.s;
 if(a==="tab"){tab=v;delId=null;render()}
 else if(a==="gr"){S.cls=v+"-"+gk()[1];delId=null;save();render()}
 else if(a==="gp"){S.cls=gk()[0]+"-"+v;delId=null;save();render()}
 else if(a==="prev")go(-1);else if(a==="next")go(1);
 else if(a==="tk"){const t=b.dataset.t;upd(id,x=>{x.f=x.f.includes(t)?x.f.replace(t,""):x.f+t})}
 else if(a==="bk")upd(id,x=>{const i=x.b.indexOf(v);i<0?x.b.push(v):x.b.splice(i,1)});
 else if(a==="pt"){const d=+b.dataset.d;upd(id,x=>{x.p=Math.max(0,x.p+d)})}
 else if(a==="det"){det=id;render()}
 else if(a==="ov"){if(e.target===b){det=null;render()}}
 else if(a==="close"){det=null;render()}
 else if(a==="add"){const ta=document.getElementById("nn"),have=list().map(s=>s.n.toLowerCase());
  ta.value.split("\n").map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!have.includes(n.toLowerCase())){const i=Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.st[i]={n,c:S.cls};pushStu(i,S.st[i]);have.push(n.toLowerCase())}});
  save();render()}
 else if(a==="ask"){delId=id;render()}
 else if(a==="del"){delete S.st[id];pushStu(id,null);for(const k in S.m)if(k.slice(11)===id){delete S.m[k];pushMark(k,null)}delId=null;if(det===id)det=null;save();render()}
 else if(a==="exp"){const x=document.createElement("a");x.href=URL.createObjectURL(new Blob([JSON.stringify({st:S.st,m:S.m},null,1)],{type:"application/json"}));x.download="class-memo-backup-"+iso(new Date())+".json";document.body.appendChild(x);x.click();x.remove()}
 else if(a==="login")doLogin();
 else if(a==="out"){AU.signOut(auth).then(()=>{S.st={};S.m={};save()})}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pw")doLogin()});
document.addEventListener("change",e=>{
 if(e.target.id==="dt"){if(e.target.value)date=clamp(e.target.value);render()}
 if(e.target.id==="sm"){sm=e.target.value;render()}
});

render();
if(CFG)(async()=>{try{
 const B="https://www.gstatic.com/firebasejs/10.14.1/";
 const[A,Au,F]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
 const app=A.initializeApp(CFG);AU=Au;auth=Au.getAuth(app);
 FSM=Object.assign({},F,{db:F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})});
 Au.onAuthStateChanged(auth,u=>{user=u;authReady=true;if(unsub){unsub();unsub=null}FS=null;if(u)listen();else status="Signed out";render()})
}catch(err){failed=true;status="Sync unavailable (no internet?). This device only";render()}})();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
